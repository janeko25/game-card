<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Картка Кірбі</title>
    <link rel="stylesheet" href="./style/main.css" />
  </head>
  <body>
    <main>
      <section class="card">
        <div class="container">
          <div class="card__box">
            <img class="card__img" src="./img/icon.webp" alt="Кірбі — герой відеогри" />
            <p class="card__role">Герой відеогри</p>
            <h1 class="card__title">Кірбі</h1>
            <div class="card__rating">
              <span class="card__score">5/5</span>
               <svg class="icon icon-star card__star" aria-hidden="true">
                <use href="./img/symbol-defs.svg#icon-star"></use>
              </svg>
            </div>
            <p class="card__text">Кірбі — добрий герой, який подорожує та допомагає друзям</p>
            <ul class="card__skill">
              <li class="card__item">Здуває ворогів</li>
              <li class="card__item">Літає</li>
              <li class="card__item">Копіює здібності</li>
            </ul>
            <button class="card__btn" type="button">Дізнатися більше</button>
            <button class="card__btn" type="button">Обрати Кірбі</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
